name: Deploy

on:
  workflow_dispatch:
  push:
    # 只有推送到 main 时自动部署；如果生产分支改成 dev/master，在这里调整。
    branches:
      - main
    # 只有当本次 push 的全部变更都属于非运行态协作、文档、测试或示例资产时才跳过部署。
    # 任意未命中 paths-ignore 的代码、依赖、数据、图片、Docker 或服务器部署配置变更仍会触发构建。
    paths-ignore:
      - ".agents/**"
      - ".codex/**"
      - ".env.example"
      - ".gitignore"
      - "AGENTS.md"
      - "README.md"
      - "backup/**"
      - "codex_logs/**"
      - "components.json"
      - "compose.yaml"
      - "deploy/server/.env.example"
      - "docs/**"
      - "eslint.config.mjs"
      - "example/**"
      - "manual-tests/**"
      - "openspec/**"
      - "skills-lock.json"
      - "tests/**"
      - "vitest.config.ts"
      - "vitest.manual-llm.config.ts"

permissions:
  # checkout 代码需要读取仓库内容。
  contents: read
  # 推送 GHCR 镜像需要写 GitHub Packages。
  packages: write

concurrency:
  # 同一分支只保留最新部署，避免连续 push 的旧部署任务后完成并覆盖运行态。
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # 服务器上的部署目录，需要和 deploy/server 模板实际上传位置一致。
  DEPLOY_PATH: /opt/fitmate

jobs:
  build-and-deploy:
    name: Build and deploy Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # 拉取当前提交代码，供 Docker build 使用。
        uses: actions/checkout@v6

      - name: Prepare image names
        id: image
        shell: bash
        run: |
          # GHCR 镜像名必须小写；github.repository 可能包含大写字符。
          repo="${GITHUB_REPOSITORY,,}"
          echo "app=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "ops=ghcr.io/${repo}-ops" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        # 明确安装新版 Buildx，避免 GitHub Actions cache backend 走已废弃的旧 API。
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Login to GHCR
        # 使用 GitHub Actions 自动注入的 GITHUB_TOKEN 推送当前仓库的容器镜像。
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        # runner target 是真正对外服务的 Next.js standalone 镜像。
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.image.outputs.app }}:latest
            ${{ steps.image.outputs.app }}:${{ github.sha }}
          cache-from: type=gha,scope=fitmate-runner,version=2
          cache-to: type=gha,mode=max,scope=fitmate-runner,version=2

      - name: Build and push ops image
        # ops target 用于 Prisma migration、seed 和 embedding 刷新，不接收公网请求。
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ops
          push: true
          tags: |
            ${{ steps.image.outputs.ops }}:latest
            ${{ steps.image.outputs.ops }}:${{ github.sha }}
          cache-from: type=gha,scope=fitmate-ops,version=2
          cache-to: type=gha,mode=max,scope=fitmate-ops,version=2

      - name: Prepare SSH
        shell: bash
        run: |
          # SERVER_SSH_KEY 是部署专用私钥；公钥需要提前放到服务器用户的 authorized_keys。
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # SERVER_HOST / SERVER_PORT 来自 GitHub Actions Repository secrets。
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync server deployment files
        shell: bash
        run: |
          # docker-compose.yml 和 Caddyfile 是版本化部署配置；生产 .env 只保留在服务器，不从仓库覆盖。
          scp -i ~/.ssh/deploy_key -P "${{ secrets.SERVER_PORT }}" \
            deploy/server/docker-compose.yml \
            deploy/server/Caddyfile \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Deploy on server
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            APP_IMAGE="${{ steps.image.outputs.app }}:${{ github.sha }}" \
            OPS_IMAGE="${{ steps.image.outputs.ops }}:${{ github.sha }}" \
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}" \
            'bash -s' <<'EOF'
              set -euo pipefail

              # 显式绑定服务器部署文件，避免 docker compose 读取到其他目录或旧环境文件。
              ENV_FILE="$DEPLOY_PATH/.env"
              COMPOSE_FILE="$DEPLOY_PATH/docker-compose.yml"

              compose() {
                docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" "$@"
              }

              set_env_value() {
                key="$1"
                value="$2"

                if grep -q "^${key}=" "$ENV_FILE"; then
                  sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
                else
                  printf '\n%s=%s\n' "$key" "$value" >> "$ENV_FILE"
                fi
              }

              # 部署目录内的 docker-compose.yml / Caddyfile 已由上一步同步；生产 .env 仍由服务器维护。
              cd "$DEPLOY_PATH"
              test -f "$ENV_FILE"
              test -f "$COMPOSE_FILE"

              # 每次部署把 .env 中的镜像版本锁到当前提交，便于回滚和排查。
              set_env_value "APP_IMAGE" "$APP_IMAGE"
              set_env_value "OPS_IMAGE" "$OPS_IMAGE"

              # 先校验最终 Compose 配置但不打印展开后的生产 .env，避免部署日志泄露密钥。
              compose config >/dev/null

              configured_images="$(compose --profile ops config --images)"
              printf '%s\n' "$configured_images"

              if ! printf '%s\n' "$configured_images" | grep -Fxq "$APP_IMAGE"; then
                echo "APP_IMAGE is not used by compose config: $APP_IMAGE" >&2
                exit 1
              fi

              if ! printf '%s\n' "$configured_images" | grep -Fxq "$OPS_IMAGE"; then
                echo "OPS_IMAGE is not used by compose config: $OPS_IMAGE" >&2
                exit 1
              fi

              # 拉取新镜像，先运行 migration，再替换无状态 app 容器，避免 .env 已更新但旧容器继续运行。
              echo "pulling deployment images..."
              compose --profile ops pull app migrator
              echo "running migrator..."
              migration_container="fitmate-migrator-deploy"
              docker rm -f "$migration_container" >/dev/null 2>&1 || true
              compose --profile ops run -d --name "$migration_container" migrator >/dev/null
              migration_exit_code="$(docker wait "$migration_container")"
              docker logs "$migration_container" || true
              docker rm -f "$migration_container" >/dev/null 2>&1 || true

              if [ "$migration_exit_code" != "0" ]; then
                echo "migrator failed with exit code $migration_exit_code" >&2
                exit "$migration_exit_code"
              fi

              echo "migration complete"
              echo "recreating app container..."
              docker rm -f fitmate-app 2>/dev/null || true
              compose up -d --force-recreate --no-deps app
              echo "ensuring caddy and db are running..."
              compose up -d --remove-orphans caddy db

              # 部署成功必须以运行态镜像等于当前 commit 镜像为准，而不是只看 workflow 命令退出。
              echo "verifying running app image..."
              running_image="$(docker inspect fitmate-app --format '{{.Config.Image}}')"
              if [ "$running_image" != "$APP_IMAGE" ]; then
                echo "fitmate-app image mismatch: expected $APP_IMAGE, got $running_image" >&2
                compose ps >&2
                exit 1
              fi

              echo "fitmate-app is running $running_image"

              # 清理无引用旧镜像，避免轻量服务器磁盘被历史镜像占满。
              docker image prune -f
          EOF
