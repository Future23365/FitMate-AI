<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitMate AI - 训练中</title>
  <style>
    :root {
      --bg: #f8fbff;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --subtle: #94a3b8;
      --line: #e5eaf2;
      --blue: #2563eb;
      --blue-2: #3b82f6;
      --blue-soft: #eff6ff;
      --green: #22c55e;
      --red: #ef4444;
      --shadow: 0 14px 40px rgba(15, 23, 42, 0.06);
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top center, #ffffff 0%, var(--bg) 56%, #f3f7fd 100%);
      color: var(--text);
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 26px 32px 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-title {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .back-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #111827;
      font-size: 30px;
      line-height: 1;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .icon-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      border-radius: 50%;
      color: #0f172a;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .icon-btn svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
    }

    .badge {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: #ef233c;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
    }

    .summary-card {
      min-height: 128px;
      padding: 28px 34px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
      border-radius: var(--radius-lg);
      display: grid;
      grid-template-columns: 1.7fr 1fr 1fr 1fr;
      align-items: center;
      gap: 28px;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
    }

    .plan-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .plan-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #eef6ff, #eaf2ff);
      color: var(--blue);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px #dceafe;
    }

    .plan-icon svg {
      width: 36px;
      height: 36px;
      stroke-width: 2.5;
    }

    .plan-title {
      font-size: 22px;
      font-weight: 760;
      margin-bottom: 10px;
    }

    .plan-meta {
      color: #475569;
      font-size: 16px;
      letter-spacing: 0.01em;
    }

    .metric {
      min-height: 74px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-left: 1px solid var(--line);
    }

    .metric-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #475569;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .metric-label svg {
      width: 21px;
      height: 21px;
      color: #43536b;
    }

    .metric-value {
      font-size: 31px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .metric-value small {
      font-size: 17px;
      margin-left: 5px;
      font-weight: 700;
    }

    .workspace {
      display: grid;
      grid-template-columns: 390px minmax(520px, 1fr) 410px;
      gap: 22px;
      align-items: start;
    }

    .card {
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .image-card {
      min-height: 500px;
      padding: 24px;
    }

    .current-chip {
      display: inline-flex;
      align-items: center;
      height: 40px;
      padding: 0 18px;
      border-radius: 10px;
      background: linear-gradient(180deg, var(--blue-2), var(--blue));
      color: #fff;
      font-size: 16px;
      font-weight: 750;
      margin-bottom: 14px;
      box-shadow: 0 10px 24px rgba(37, 99, 235, .18);
    }

    .exercise-img {
      height: 420px;
      border-radius: 20px;
      background:
        radial-gradient(circle at center, #ffffff 0 40%, #f5f7fb 70% 100%);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .squat-illustration {
      width: 300px;
      height: 330px;
      position: relative;
    }

    .head {
      position: absolute;
      left: 160px;
      top: 18px;
      width: 54px;
      height: 62px;
      background: #f2c7a8;
      border-radius: 42% 42% 48% 48%;
      box-shadow: inset -8px 0 0 rgba(0,0,0,.05);
    }

    .hair {
      position: absolute;
      left: 151px;
      top: 5px;
      width: 70px;
      height: 38px;
      background: #111827;
      border-radius: 55% 55% 45% 45%;
      transform: rotate(-8deg);
    }

    .neck {
      position: absolute;
      left: 173px;
      top: 72px;
      width: 24px;
      height: 28px;
      background: #eebc9c;
      border-radius: 8px;
    }

    .torso {
      position: absolute;
      left: 115px;
      top: 92px;
      width: 88px;
      height: 120px;
      background: #111827;
      border-radius: 30px 30px 22px 22px;
      transform: rotate(-12deg);
    }

    .arm-left, .arm-right {
      position: absolute;
      height: 20px;
      background: #f0c1a0;
      border-radius: 999px;
      transform-origin: left center;
    }

    .arm-left {
      left: 182px;
      top: 112px;
      width: 128px;
      transform: rotate(0deg);
    }

    .arm-right {
      left: 180px;
      top: 142px;
      width: 122px;
      transform: rotate(2deg);
    }

    .shorts {
      position: absolute;
      left: 88px;
      top: 190px;
      width: 110px;
      height: 58px;
      background: #0f172a;
      border-radius: 20px;
      transform: rotate(-6deg);
    }

    .thigh-left, .thigh-right, .calf-left, .calf-right {
      position: absolute;
      background: #f0c1a0;
      border-radius: 999px;
      transform-origin: center;
    }

    .thigh-left {
      left: 53px;
      top: 230px;
      width: 112px;
      height: 27px;
      transform: rotate(22deg);
    }

    .calf-left {
      left: 49px;
      top: 256px;
      width: 29px;
      height: 88px;
      transform: rotate(-12deg);
    }

    .thigh-right {
      left: 135px;
      top: 236px;
      width: 105px;
      height: 27px;
      transform: rotate(-7deg);
    }

    .calf-right {
      left: 219px;
      top: 248px;
      width: 28px;
      height: 82px;
      transform: rotate(-12deg);
    }

    .shoe-left, .shoe-right {
      position: absolute;
      width: 70px;
      height: 28px;
      background: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 18px 24px 12px 12px;
      box-shadow: 0 4px 10px rgba(15,23,42,.08);
    }

    .shoe-left {
      left: 24px;
      top: 330px;
      transform: rotate(-6deg);
    }

    .shoe-right {
      left: 202px;
      top: 322px;
      transform: rotate(4deg);
    }

    .timer-zone {
      min-height: 500px;
      padding: 12px 28px 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .exercise-title {
      font-size: 42px;
      font-weight: 850;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }

    .muscle {
      color: #334155;
      font-size: 20px;
      margin-bottom: 28px;
    }

    .timer {
      font-size: clamp(128px, 15vw, 196px);
      line-height: .9;
      font-weight: 900;
      letter-spacing: -0.08em;
      color: #0f1b31;
      margin-bottom: 24px;
      text-shadow: 0 16px 32px rgba(15, 23, 42, 0.08);
      font-variant-numeric: tabular-nums;
    }

    .goal {
      font-size: 23px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
    }

    .progress {
      width: min(560px, 78%);
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      background: #e7ecf4;
      margin-bottom: 36px;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 33%;
      background: linear-gradient(90deg, var(--blue), #60a5fa);
      border-radius: 999px;
    }

    .audio-pill {
      height: 54px;
      min-width: 540px;
      max-width: 100%;
      padding: 0 22px;
      border-radius: 13px;
      background: #f2f7ff;
      border: 1px solid #d9e7ff;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 28px;
      font-size: 18px;
      font-weight: 700;
    }

    .audio-pill svg {
      width: 24px;
      height: 24px;
      color: #1d4ed8;
    }

    .wave {
      height: 26px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .wave span {
      width: 3px;
      height: var(--h);
      border-radius: 99px;
      background: var(--blue-2);
    }

    .main-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 80px;
      margin-top: 8px;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #334155;
      font-weight: 700;
      font-size: 17px;
    }

    .round-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 1px solid #dbe3ee;
      background: #fff;
      color: #1e293b;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.06);
    }

    .round-btn svg {
      width: 30px;
      height: 30px;
    }

    .pause-btn {
      width: 112px;
      height: 112px;
      border: 0;
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      color: #fff;
      box-shadow: 0 22px 38px rgba(37, 99, 235, 0.28);
    }

    .pause-btn svg {
      width: 48px;
      height: 48px;
      fill: currentColor;
    }

    .side-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .queue-card {
      padding: 20px 24px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 19px;
      font-weight: 800;
    }

    .collapse {
      color: var(--blue);
      font-size: 15px;
      font-weight: 700;
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .exercise-row {
      min-height: 78px;
      display: grid;
      grid-template-columns: 76px 1fr 36px;
      align-items: center;
      gap: 16px;
      padding: 10px 12px;
      border-radius: 14px;
    }

    .exercise-row.active {
      background: #eef6ff;
    }

    .thumb {
      width: 76px;
      height: 58px;
      border-radius: 10px;
      background: #f1f5f9;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #1e293b;
    }

    .mini-figure {
      width: 58px;
      height: 42px;
      position: relative;
    }

    .mini-figure::before,
    .mini-figure::after {
      content: "";
      position: absolute;
      background: #0f172a;
      border-radius: 99px;
    }

    .mini-figure.jump::before { width: 12px; height: 36px; left: 22px; top: 4px; }
    .mini-figure.jump::after { width: 56px; height: 4px; left: 1px; top: 11px; transform: rotate(-28deg); }
    .mini-figure.squat::before { width: 36px; height: 18px; left: 10px; top: 16px; transform: rotate(-12deg); }
    .mini-figure.squat::after { width: 48px; height: 4px; left: 5px; top: 9px; }
    .mini-figure.push::before { width: 50px; height: 8px; left: 3px; top: 21px; }
    .mini-figure.push::after { width: 6px; height: 22px; left: 42px; top: 17px; }
    .mini-figure.climb::before { width: 50px; height: 8px; left: 3px; top: 17px; transform: rotate(8deg); }
    .mini-figure.climb::after { width: 34px; height: 6px; left: 16px; top: 31px; transform: rotate(-18deg); }
    .mini-figure.plank::before { width: 54px; height: 7px; left: 2px; top: 20px; }
    .mini-figure.plank::after { width: 8px; height: 22px; left: 12px; top: 18px; }

    .row-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .row-time {
      color: #64748b;
      font-size: 15px;
      font-weight: 600;
    }

    .status {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #64748b;
      border: 2px solid #94a3b8;
      background: #fff;
    }

    .status.done {
      border: 0;
      color: #fff;
      background: var(--green);
    }

    .status.play {
      border: 0;
      color: #fff;
      background: var(--blue);
    }

    .control-card {
      padding: 22px 24px;
    }

    .control-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .settings {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      font-size: 14px;
      font-weight: 700;
    }

    .control-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .small-action {
      height: 54px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 800;
      background: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .danger {
      border: 1px solid #f3a0a0;
      color: #ef4444;
    }

    .outline-blue {
      border: 1px solid #93b9ff;
      color: var(--blue);
    }

    .tip-bar {
      margin-top: 30px;
      min-height: 62px;
      border-radius: 12px;
      background: #eff6ff;
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 18px;
      color: #334155;
      font-size: 17px;
    }

    .tip-bar svg {
      color: var(--blue);
      width: 26px;
      height: 26px;
      flex: none;
    }

    .tip-title {
      color: var(--blue);
      font-weight: 850;
      margin-right: 12px;
    }

    .tip-close {
      margin-left: auto;
      border: 0;
      background: transparent;
      color: #334155;
      font-size: 30px;
      cursor: pointer;
    }

    @media (max-width: 1200px) {
      .summary-card {
        grid-template-columns: 1fr 1fr;
      }
      .metric { border-left: 0; }
      .workspace {
        grid-template-columns: 1fr;
      }
      .image-card, .timer-zone { min-height: auto; }
      .timer { font-size: 120px; }
      .audio-pill { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="back-title">
        <div class="back-icon">←</div>
        <span>训练中</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" aria-label="通知">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge">2</span>
        </button>
        <button class="icon-btn" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.36 1.04V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 8.6 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1.04-.36H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.04 3.9l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 0 .36-1.04V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15.4 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.38.36.7.66.98.3.27.68.42 1.07.42H21a2 2 0 1 1 0 4h-.09c-.39 0-.77.15-1.07.42-.3.28-.52.6-.66.98Z"/></svg>
        </button>
      </div>
    </header>

    <section class="summary-card">
      <div class="plan-info">
        <div class="plan-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M13 4a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"/><path d="m9 8 4 2 1 4 4 1"/><path d="m10 11-3 2-2 4"/><path d="m13 10 3-3"/><path d="m8 18 3-4 4 2"/></svg>
        </div>
        <div>
          <div class="plan-title">燃脂循环训练</div>
          <div class="plan-meta">45 分钟 · 5 个动作 · 280 kcal</div>
        </div>
      </div>
      <div class="metric">
        <div class="metric-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>已训练时间</div>
        <div class="metric-value">18:24</div>
      </div>
      <div class="metric">
        <div class="metric-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8.5 14.5A4 4 0 0 0 12 21a4 4 0 0 0 3.5-6.5C14 12 14 10 16 7c-3.5.6-5.5 2.7-6 6-1.1-1-1.4-2.4-1-4-2 1.5-3 3.5-.5 5.5Z"/></svg>消耗热量</div>
        <div class="metric-value">126 <small>kcal</small></div>
      </div>
      <div class="metric">
        <div class="metric-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>平均心率</div>
        <div class="metric-value">128 <small>bpm</small></div>
      </div>
    </section>

    <section class="workspace">
      <aside class="card image-card">
        <span class="current-chip">当前动作 2 / 5</span>
        <div class="exercise-img">
          <div class="squat-illustration" aria-label="深蹲动作示意">
            <div class="hair"></div>
            <div class="head"></div>
            <div class="neck"></div>
            <div class="torso"></div>
            <div class="arm-left"></div>
            <div class="arm-right"></div>
            <div class="shorts"></div>
            <div class="thigh-left"></div>
            <div class="calf-left"></div>
            <div class="thigh-right"></div>
            <div class="calf-right"></div>
            <div class="shoe-left"></div>
            <div class="shoe-right"></div>
          </div>
        </div>
      </aside>

      <section class="timer-zone">
        <div class="exercise-title">深蹲</div>
        <div class="muscle">锻炼部位：下肢（大腿、臀部）</div>
        <div class="timer">00:28</div>
        <div class="goal">目标：45 秒</div>
        <div class="progress"><span></span></div>
        <div class="audio-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <span>每秒提示音：已开启</span>
          <div class="wave" aria-hidden="true">
            <span style="--h:10px"></span><span style="--h:18px"></span><span style="--h:24px"></span><span style="--h:14px"></span><span style="--h:22px"></span><span style="--h:12px"></span><span style="--h:26px"></span><span style="--h:18px"></span><span style="--h:9px"></span><span style="--h:20px"></span><span style="--h:25px"></span><span style="--h:13px"></span><span style="--h:21px"></span><span style="--h:16px"></span><span style="--h:24px"></span><span style="--h:11px"></span><span style="--h:18px"></span><span style="--h:23px"></span><span style="--h:12px"></span><span style="--h:25px"></span>
          </div>
        </div>
        <div class="main-controls">
          <div class="control-item">
            <button class="round-btn" aria-label="上一个">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 20 9 12l10-8v16Z"/><path d="M5 19V5"/></svg>
            </button>
            <span>上一个</span>
          </div>
          <div class="control-item">
            <button class="round-btn pause-btn" aria-label="暂停">
              <svg viewBox="0 0 24 24"><path d="M8 5h3v14H8V5Zm5 0h3v14h-3V5Z"/></svg>
            </button>
            <span>暂停</span>
          </div>
          <div class="control-item">
            <button class="round-btn" aria-label="下一个">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m5 4 10 8-10 8V4Z"/><path d="M19 5v14"/></svg>
            </button>
            <span>下一个</span>
          </div>
        </div>
      </section>

      <aside class="side-stack">
        <div class="card queue-card">
          <div class="card-head">
            <div class="card-title">训练项目（5 / 5）</div>
            <div class="collapse">收起⌃</div>
          </div>
          <div class="exercise-list">
            <div class="exercise-row">
              <div class="thumb"><div class="mini-figure jump"></div></div>
              <div><div class="row-name">开合跳</div><div class="row-time">45 秒</div></div>
              <div class="status done">✓</div>
            </div>
            <div class="exercise-row active">
              <div class="thumb"><div class="mini-figure squat"></div></div>
              <div><div class="row-name" style="color:var(--blue)">深蹲</div><div class="row-time">45 秒</div></div>
              <div class="status play">▶</div>
            </div>
            <div class="exercise-row">
              <div class="thumb"><div class="mini-figure push"></div></div>
              <div><div class="row-name">俯卧撑</div><div class="row-time">45 秒</div></div>
              <div class="status">3</div>
            </div>
            <div class="exercise-row">
              <div class="thumb"><div class="mini-figure climb"></div></div>
              <div><div class="row-name">登山跑</div><div class="row-time">45 秒</div></div>
              <div class="status">4</div>
            </div>
            <div class="exercise-row">
              <div class="thumb"><div class="mini-figure plank"></div></div>
              <div><div class="row-name">平板支撑</div><div class="row-time">45 秒</div></div>
              <div class="status">5</div>
            </div>
          </div>
        </div>

        <div class="card control-card">
          <div class="control-head">
            <div class="card-title">训练控制</div>
            <div class="settings">⚙ 设置</div>
          </div>
          <div class="control-buttons">
            <button class="small-action danger">□ 结束训练</button>
            <button class="small-action outline-blue">▷ 跳过本组</button>
          </div>
        </div>
      </aside>
    </section>

    <div class="tip-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.74V17h8v-2.26A7 7 0 0 0 12 2Z"/></svg>
      <span class="tip-title">训练提示</span>
      <span>保持核心收紧，动作标准，注意呼吸节奏，避免膝盖内扣。</span>
      <button class="tip-close" aria-label="关闭提示">×</button>
    </div>
  </main>
</body>
</html>
